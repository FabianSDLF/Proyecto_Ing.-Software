spring.application.name=practicas
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_practicas}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Archivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.enabled=true
file.upload-dir=./uploads

# JWT Security Configuration (TR-01)
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtY2hhbmdlLWluLXByb2QtbWluLTMyLWNoYXJz}
jwt.expiration=86400000

# Configuración para envío de correos (Comprobantes)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=practicas.ubb.notificaciones@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true