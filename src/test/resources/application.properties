spring.application.name=practicas-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Files / Uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
file.upload-dir=./test-uploads

# JWT Security Configuration
jwt.secret=c3VwZXItc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtY2hhbmdlLWluLXByb2QtbWluLTMyLWNoYXJz
jwt.expiration=86400000

# Flyway disabled in H2 test profile (Hibernate create-drop manages test schema)
spring.flyway.enabled=false

# Mail configuration for JavaMailSender bean creation in tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@ubb.cl
spring.mail.password=test

